description: Nuvoton NuMaker high-speed USB 2.0 device controller

compatible: "nuvoton,numaker-hsusbd"

include: [usb-ep.yaml, reset-device.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  resets:
    required: true

  clocks:
    required: true

  dma-buffer-size:
    type: int
    required: true
    description: |
      Size of DMA buffer in bytes

  allow-disable-usb-on-unplug:
    type: boolean
    description: |
      Supports USB controller can be disabled temporarily when USB cable is unplugged
      and then enabled back when the cable is re-plugged.

  bulk-ep-buf-packets:
    type: array
    description: |
      Per-endpoint bulk FIFO depth in MPS-sized packets, as flat
      (endpoint-address, packet-count) pairs.  Reserves
      packet-count * MPS bytes of HSUSBD DMA buffer for the listed
      endpoints at ep_enable time, allowing HW to pipeline DMA fill
      with USB transmission (paired with UDC_NUMAKER_FAST_IN).
      Endpoints not listed default to 1 (MPS-only).  The total
      reservation across all bulk endpoints cannot exceed
      dma-buffer-size; the driver falls back to MPS for any EP whose
      enlarged request will not fit.

      Example — 4-MPS depth on bulk-IN 0x81 (the bulk-OUT 0x02 is
      omitted so it falls back to MPS):

          bulk-ep-buf-packets = <0x81 4>;
